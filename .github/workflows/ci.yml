# CI, and the two halves of the deploy pipeline (dotfiles docs/deploy-pipeline.md):
#
#   tests  on every push and pull request: ./test.sh (deps, shell, prettier, tsc,
#          vitest, build). Vercel's Deployment Checks hold production until this
#          job and security.yml's two jobs are green, so keep the job name.
#   live   after Vercel reports a production deployment: production serves the
#          deployed commit (<meta name="build-commit">, stamped by vite.config.ts).
#
# Vercel builds and deploys on its own (Git integration). Secrets: security.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Lockfile only, no install scripts; the one script this repo needs runs by name.
      - run: npm ci --ignore-scripts
      - run: npm run sync:js-dos
      - run: ./test.sh

  live:
    uses: pieteradejong/dotfiles/.github/workflows/vercel-live-reusable.yml@main
    with:
      site_url: https://cnc-web-padj.vercel.app
      project: cnc-web-padj
